<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glowmotion Home</title>
    <meta name="google-site-verification" content="kWqRcvegvljBlW7CSjWe3pE4oxluAUzETDxouyrDQN0" />
    <meta name="naver-site-verification" content="44b1ddcec6e9f3d37c4f9c24f21b8f1b10d86047" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #050505; color: #fff; overflow-x: hidden; }

        /* 상단 완전히 까만 고정 네비게이션 바 */
        .navbar {
            background-color: #000000;
            width: 100%;
            height: 70px;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-container {
            width: 100%;
            max-width: 1400px;
            height: 100%;
            margin: 0 auto;
            padding: 0 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: #ffffff;
            font-size: 20px;
            font-weight: 700;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: 1.5px;
        }

        .logo-img { height: 35px; width: auto; object-fit: contain; }

        .nav-menu { display: flex; gap: 30px; }
        .nav-item {
            color: #ccc;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 1px;
            transition: color 0.3s;
            position: relative;
            z-index: 10000;
            cursor: pointer;
        }
        .nav-item:hover { color: #fff; }

        /* 햄버거 토글 버튼 (PC에서는 숨김) */
        .menu-toggle {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            width: 28px;
            height: 20px;
            background: transparent;
            border: none;
            cursor: pointer;
            z-index: 10001;
        }
        .menu-toggle span {
            display: block;
            width: 100%;
            height: 2px;
            background-color: #ffffff;
            transition: all 0.3s ease;
        }

        /* 1. 메인 비주얼 영상 영역 */
        .hero-section {
            margin-top: 70px;
            width: 100%;
            height: calc(100vh - 70px);
            background-color: #0d0d12;
            position: relative;
            overflow: hidden;
        }

        .hero-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 2. 하얀색 띠 섹션 */
        .info-section {
            width: 100%;
            background-color: #ffffff;
            padding: 25px 0;
        }

        .info-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 30px;
            display: flex;
            align-items: center;
        }

        .brand-group {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .bar-logo-img {
            height: 36px;
            width: auto;
            display: block;
        }

        .bar-company-name {
            font-size: 22px;
            font-weight: 800;
            color: #111111;
            letter-spacing: 1.5px;
            line-height: 1;
            display: inline-block;
        }

        .youtube-link {
            margin-left: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #111111;
            text-decoration: none;
            transition: opacity 0.2s, transform 0.2s;
        }

        .youtube-link:hover {
            opacity: 0.7;
            transform: scale(1.05);
        }

        .youtube-icon {
            width: 30px;
            height: 21px;
            fill: currentColor;
            display: block;
        }

        /* 모바일 반응형 (1024px 이하) */
        @media (max-width: 1024px) {
            .nav-container {
                padding: 0 20px;
            }
            .logo {
                font-size: 15px; /* 글씨 크기 살짝 조정 */
                gap: 10px;
            }
            .logo-img {
                height: 28px; /* 로고 이미지 크기를 기존보다 키움 */
            }
            .menu-toggle {
                display: flex;
            }
            .nav-menu {
                position: absolute;
                top: 70px;
                left: 0;
                width: 100%;
                background-color: #000000;
                flex-direction: column;
                align-items: center;
                gap: 0;
                max-height: 0;
                overflow: hidden;
                transition: max-height 0.3s ease-in-out;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            }
            .nav-menu.active {
                max-height: 350px;
            }
            .nav-item {
                width: 100%;
                text-align: center;
                padding: 15px 0;
                font-size: 15px;
                border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            }
        }
    </style>
</head>
<body>

    <!-- 상단 네비게이션 바 -->
    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <img src="logo.png" alt="Glowmotion Logo" class="logo-img" onerror="this.style.display='none'">
                <span>GLOWMOTION</span>
            </a>
            <!-- 햄버거 토글 버튼 -->
            <button class="menu-toggle" id="menuToggle" aria-label="메뉴 열기">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <nav class="nav-menu" id="navMenu">
                <a href="about.html" class="nav-item">ABOUT</a>
                <a href="talent.html" class="nav-item">TALENT</a>
                <a href="news.html" class="nav-item">NEWS</a>
                <a href="notice.html" class="nav-item">NOTICE</a>
                <a href="contact.html" class="nav-item">CONTACT</a>
            </nav>
        </div>
    </header>

    <!-- 메인 비주얼 영상 영역 -->
    <section class="hero-section">
        <video class="hero-video" autoplay loop muted playsinline>
            <source src="logo move.mkv" type="video/mp4">
            <source src="logo move.mkv" type="video/webm">
            브라우저가 비디오 태그를 지원하지 않습니다.
        </video>
    </section>

    <!-- 하얀 띠 섹션 -->
    <section class="info-section">
        <div class="info-container">
            <div class="brand-group">
                <img src="black logo.png" alt="Glowmotion Black Logo" class="bar-logo-img" onerror="this.style.display='none'">
                <span class="bar-company-name">GLOWMOTION</span>
            </div>
            <a href="https://www.youtube.com/@GlowmotionEntertainment" target="_blank" rel="noopener noreferrer" class="youtube-link" title="Glowmotion YouTube">
                <svg class="youtube-icon" viewBox="0 0 24 17" xmlns="http://www.w3.org/2000/svg">
                    <path d="M23.498 2.628a3.016 3.016 0 0 0-2.122-2.136C19.505 0 12 0 12 0s-7.505 0-9.377.492A3.017 3.017 0 0 0 .502 2.628C0 4.515 0 8.44 0 8.44s0 3.926.502 5.813a3.016 3.016 0 0 0 2.122 2.136c1.871.493 9.376.493 9.376.493s7.505 0 9.377-.493a3.015 3.015 0 0 0 2.122-2.136C24 12.366 24 8.44 24 8.44s0-3.925-.502-5.812zM9.545 12.022V4.858l6.273 3.582-6.273 3.582z"/>
                </svg>
            </a>
        </div>
    </section>

    <!-- 햄버거 메뉴 작동용 자바스크립트 -->
    <script>
        const menuToggle = document.getElementById('menuToggle');
        const navMenu = document.getElementById('navMenu');

        menuToggle.addEventListener('click', () => {
            navMenu.classList.toggle('active');
        });

        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', () => {
                navMenu.classList.remove('active');
            });
        });
    </script>
</body>
</html>
