<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONTACT - Glowmotion</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #050505; color: #fff; overflow-x: hidden; }

        /* 상단 완전히 까만 고정 네비게이션 바 (수정된 버전) */
        .navbar {
            background-color: #000000;
            width: 100%;
            height: 70px;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999; /* 클릭이 절대 가려지지 않도록 최상단으로 설정 */
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-container {
            width: 100%;
            max-width: 100%;
            height: 100%;
            margin: 0 auto;
            padding: 0 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: #ffffff;
            font-size: 20px;
            font-weight: 700;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: 1.5px;
        }

        .logo-img { height: 35px; width: auto; }

        .nav-menu { display: flex; gap: 30px; }
        .nav-item {
            color: #ccc;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 1px;
            transition: color 0.3s;
            position: relative;
            z-index: 10000; /* 링크 자체에 마우스 이벤트가 확실히 닿도록 지정 */
            cursor: pointer;
        }
        .nav-item:hover, .nav-item.active { color: #fff; font-weight: 700; }

        /* CONTACT 메인 영역 */
        .contact-hero {
            margin-top: 70px;
            width: 100%;
            min-height: calc(100vh - 70px - 86px);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            background-color: #050505;
        }

        .contact-box {
            max-width: 800px;
            width: 100%;
        }

        .contact-title {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: 3px;
            margin-bottom: 20px;
            color: #ffffff;
        }

        .contact-subtitle {
            font-size: 16px;
            color: #888888;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }

        .email-card {
            background-color: #0e0e12;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 40px 30px;
            display: inline-block;
            transition: transform 0.3s, border-color 0.3s;
        }

        .email-card:hover {
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-3px);
        }

        .email-label {
            font-size: 14px;
            font-weight: 600;
            color: #aaaaaa;
            letter-spacing: 2px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .email-address {
            font-size: 26px;
            font-weight: 700;
            color: #ffffff;
            text-decoration: none;
            letter-spacing: 1px;
            transition: color 0.2s;
            word-break: break-all;
        }

        .email-address:hover {
            color: #4da6ff;
        }

        /* 하단 하얀 띠 섹션 */
        .info-section {
            width: 100%;
            background-color: #ffffff;
            padding: 25px 0;
        }

        .info-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 30px;
            display: flex;
            align-items: center;
        }

        .brand-group {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .bar-logo-img {
            height: 36px;
            width: auto;
            display: block;
        }

        .bar-company-name {
            font-size: 22px;
            font-weight: 800;
            color: #111111;
            letter-spacing: 1.5px;
            line-height: 1;
            display: inline-block;
        }

        .youtube-link {
            margin-left: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #111111;
            text-decoration: none;
            transition: opacity 0.2s, transform 0.2s;
        }

        .youtube-link:hover {
            opacity: 0.7;
            transform: scale(1.05);
        }

        .youtube-icon {
            width: 30px;
            height: 21px;
            fill: currentColor;
            display: block;
        }
    </style>
</head>
<body>

    <!-- 상단 네비게이션 바 -->
    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <img src="logo.png" alt="Glowmotion Logo" class="logo-img" onerror="this.style.display='none'">
                <span>GLOWMOTION</span>
            </a>
            <nav class="nav-menu">
                <a href="about.html" class="nav-item">ABOUT</a>
                <a href="talent.html" class="nav-item">TALENT</a>
                <a href="news.html" class="nav-item">NEWS</a>
                <a href="notice.html" class="nav-item">NOTICE</a>
                <a href="contact.html" class="nav-item active">CONTACT</a>
            </nav>
        </div>
    </header>

    <!-- 중앙 문의 섹션 -->
    <main class="contact-hero">
        <div class="contact-box">
            <h1 class="contact-title">CONTACT US</h1>
            <p class="contact-subtitle">비즈니스 및 제휴 문의는 아래 이메일로 연락해 주시기 바랍니다.</p>
            
            <div class="email-card">
                <div class="email-label">INQUIRY / Business Email</div>
                <!-- 지메일 편지쓰기 화면이 새 탭으로 바로 뜨도록 연결 -->
                <a href="https://mail.google.com/mail/?view=cm&fs=1&to=glowmotionentertainment@gmail.com" target="_blank" rel="noopener noreferrer" class="email-address">
                    glowmotionentertainment@gmail.com
                </a>
            </div>
        </div>
    </main>

    <!-- 최하단 하얀 띠 섹션 -->
    <section class="info-section">
        <div class="info-container">
            <div class="brand-group">
                <img src="black logo.png" alt="Glowmotion Black Logo" class="bar-logo-img" onerror="this.style.display='none'">
                <span class="bar-company-name">GLOWMOTION</span>
            </div>
            <a href="https://www.youtube.com/@GlowmotionEntertainment" target="_blank" rel="noopener noreferrer" class="youtube-link" title="Glowmotion YouTube">
                <svg class="youtube-icon" viewBox="0 0 24 17" xmlns="http://www.w3.org/2000/svg">
                    <path d="M23.498 2.628a3.016 3.016 0 0 0-2.122-2.136C19.505 0 12 0 12 0s-7.505 0-9.377.492A3.017 3.017 0 0 0 .502 2.628C0 4.515 0 8.44 0 8.44s0 3.926.502 5.813a3.016 3.016 0 0 0 2.122 2.136c1.871.493 9.376.493 9.376.493s7.505 0 9.377-.493a3.015 3.015 0 0 0 2.122-2.136C24 12.366 24 8.44 24 8.44s0-3.925-.502-5.812zM9.545 12.022V4.858l6.273 3.582-6.273 3.582z"/>
                </svg>
            </a>
        </div>
    </section>

</body>
</html>
