<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TALENT - Glowmotion</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #050505; color: #fff; overflow-x: hidden; }

        /* 상단 완전히 까만 고정 네비게이션 바 */
        .navbar {
            background-color: #000000;
            width: 100%;
            height: 70px;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-container {
            width: 100%;
            max-width: 100%;
            height: 100%;
            margin: 0 auto;
            padding: 0 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: #ffffff;
            font-size: 20px;
            font-weight: 700;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: 1.5px;
        }

        .logo-img { height: 35px; width: auto; }

        .nav-menu { display: flex; gap: 30px; }
        .nav-item {
            color: #ccc;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 1px;
            transition: color 0.3s;
            position: relative;
            z-index: 10000;
            cursor: pointer;
        }
        .nav-item:hover, .nav-item.active { color: #fff; font-weight: 700; }

        /* 탤런트 메인 영역 */
        .talent-hero {
            margin-top: 70px;
            width: 100%;
            min-height: calc(100vh - 70px - 86px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 40px;
            background-color: #050505;
        }

        .talent-wrapper {
            max-width: 1300px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 60px;
        }

        .talent-info { flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .talent-label { font-size: 13px; font-weight: 600; color: #777; letter-spacing: 3px; margin-bottom: 12px; text-transform: uppercase; }
        
        /* 이름과 생일 영역을 감싸는 박스 */
        .talent-name-wrapper {
            display: flex;
            align-items: baseline;
            gap: 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .talent-name { font-size: 48px; font-weight: 800; letter-spacing: 2px; color: #fff; line-height: 1.2; }
        
        /* 생일 표시 스타일 */
        .talent-birth {
            font-size: 15px;
            font-weight: 500;
            color: #aaa;
            background-color: rgba(255, 255, 255, 0.08);
            padding: 6px 14px;
            border-radius: 20px;
            letter-spacing: 1px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .talent-desc { font-size: 16px; color: #ccc; line-height: 1.9; margin-bottom: 35px; }
        .talent-desc p { margin-bottom: 16px; }

        .talent-image-container {
            flex: 0 0 420px;
            height: 600px;
            background-color: #111118;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .talent-image { width: 100%; height: 100%; object-fit: cover; display: block; }

        .info-section { width: 100%; background-color: #ffffff; padding: 25px 0; }
        .info-container { max-width: 1400px; margin: 0 auto; padding: 0 30px; display: flex; align-items: center; }
        .brand-group { display: flex; align-items: center; gap: 14px; }
        .bar-logo-img { height: 36px; width: auto; display: block; }
        .bar-company-name { font-size: 22px; font-weight: 800; color: #111; letter-spacing: 1.5px; line-height: 1; display: inline-block; }
        .youtube-link { margin-left: auto; display: flex; align-items: center; justify-content: center; color: #111; text-decoration: none; transition: opacity 0.2s, transform 0.2s; }
        .youtube-link:hover { opacity: 0.7; transform: scale(1.05); }
        .youtube-icon { width: 30px; height: 21px; fill: currentColor; display: block; }

        @media (max-width: 960px) {
            .talent-wrapper { flex-direction: column-reverse; text-align: center; gap: 40px; }
            .talent-info { align-items: center; }
            .talent-name-wrapper { justify-content: center; }
            .talent-image-container { width: 100%; max-width: 380px; height: 500px; }
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <img src="logo.png" alt="Glowmotion Logo" class="logo-img" onerror="this.style.display='none'">
                <span>GLOWMOTION</span>
            </a>
            <nav class="nav-menu">
                <a href="about.html" class="nav-item">ABOUT</a>
                <a href="talent.html" class="nav-item active">TALENT</a>
                <a href="news.html" class="nav-item">NEWS</a>
                <a href="notice.html" class="nav-item">NOTICE</a>
                <a href="contact.html" class="nav-item">CONTACT</a>
            </nav>
        </div>
    </header>

    <main class="talent-hero">
        <div class="talent-wrapper">
            <div class="talent-info">
                <span class="talent-label">OFFICIAL CREATOR</span>
                
                <!-- 이름과 생일 란 -->
                <div class="talent-name-wrapper">
                    <h1 class="talent-name">이강빛</h1>
                    <span class="talent-birth">BIRTH. 2008.02.15</span>
                </div>

                <div class="talent-desc">
                    <p>글로우모션 소속의 첫 전속 크리에이터이자 귀여움과 엉뚱함이 매력인 글로우모션의 첫딸이자 08년생 막내입니다!</p>
                    <p>게임, 소통, 라이브 콘텐츠 등 다양한 영역에서 매력과 즐거움을 선사하며, 글로우모션의 프로그래머이기도 합니다.</p>
                </div>
            </div>
            
            <div class="talent-image-container">
                <img src="이미지 제작중.png" alt="Talent Image" class="talent-image" onerror="this.src='https://via.placeholder.com/420x600/111118/ffffff?text=TALENT+PHOTO'">
            </div>
        </div>
    </main>

    <section class="info-section">
        <div class="info-container">
            <div class="brand-group">
                <img src="black logo.png" alt="Glowmotion Black Logo" class="bar-logo-img" onerror="this.style.display='none'">
                <span class="bar-company-name">GLOWMOTION</span>
            </div>
            <a href="https://www.youtube.com/@GlowmotionEntertainment" target="_blank" rel="noopener noreferrer" class="youtube-link">
                <svg class="youtube-icon" viewBox="0 0 24 17" xmlns="http://www.w3.org/2000/svg">
                    <path d="M23.498 2.628a3.016 3.016 0 0 0-2.122-2.136C19.505 0 12 0 12 0s-7.505 0-9.377.492A3.017 3.017 0 0 0 .502 2.628C0 4.515 0 8.44 0 8.44s0 3.926.502 5.813a3.016 3.016 0 0 0 2.122 2.136c1.871.493 9.376.493 9.376.493s7.505 0 9.377-.493a3.015 3.015 0 0 0 2.122-2.136C24 12.366 24 8.44 24 8.44s0-3.925-.502-5.812zM9.545 12.022V4.858l6.273 3.582-6.273 3.582z"/>
                </svg>
            </a>
        </div>
    </section>

</body>
</html>
