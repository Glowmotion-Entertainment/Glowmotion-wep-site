<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEWS - Glowmotion</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #050505; color: #fff; overflow-x: hidden; }

        /* 상단 완전히 까만 고정 네비게이션 바 (수정된 버전) */
        .navbar {
            background-color: #000000;
            width: 100%;
            height: 70px;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999; /* 클릭이 절대 가려지지 않도록 최상단으로 설정 */
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-container {
            width: 100%;
            max-width: 100%;
            height: 100%;
            margin: 0 auto;
            padding: 0 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: #ffffff;
            font-size: 20px;
            font-weight: 700;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: 1.5px;
        }

        .logo-img { height: 35px; width: auto; }

        .nav-menu { display: flex; gap: 30px; }
        .nav-item {
            color: #ccc;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 1px;
            transition: color 0.3s;
            position: relative;
            z-index: 10000; /* 링크 자체에 마우스 이벤트가 확실히 닿도록 지정 */
            cursor: pointer;
        }
        .nav-item:hover, .nav-item.active { color: #fff; font-weight: 700; }

        .news-hero {
            margin-top: 70px;
            width: 100%;
            min-height: calc(100vh - 70px - 86px);
            padding: 80px 20px;
            background-color: #050505;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .news-container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }

        .news-title {
            font-size: 40px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 40px;
            color: #ffffff;
            border-bottom: 2px solid #333333;
            padding-bottom: 20px;
        }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            width: 100%;
        }

        .news-card {
            text-decoration: none;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s;
        }

        .news-card:hover { transform: translateY(-5px); }
        .news-card:hover .news-card-title { color: #4da6ff; }

        .news-image-box {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #1a1a24;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .news-image { width: 100%; height: 100%; object-fit: cover; display: block; }
        .news-date { font-size: 13px; color: #777777; margin-bottom: 8px; }

        .news-card-title {
            font-size: 18px;
            font-weight: 700;
            line-height: 1.4;
            color: #ffffff;
            transition: color 0.2s;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .more-news-bar {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            margin-top: 40px;
        }

        .btn-more-news {
            color: #888888;
            font-size: 15px;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .btn-more-news:hover { color: #ffffff; text-decoration: underline; }

        .info-section {
            width: 100%;
            background-color: #ffffff;
            padding: 25px 0;
        }

        .info-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 30px;
            display: flex;
            align-items: center;
        }

        .brand-group { display: flex; align-items: center; gap: 14px; }
        .bar-logo-img { height: 36px; width: auto; display: block; }
        .bar-company-name {
            font-size: 22px;
            font-weight: 800;
            color: #111111;
            letter-spacing: 1.5px;
            line-height: 1;
            display: inline-block;
        }

        .youtube-link {
            margin-left: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #111111;
            text-decoration: none;
            transition: opacity 0.2s, transform 0.2s;
        }

        .youtube-link:hover { opacity: 0.7; transform: scale(1.05); }
        .youtube-icon { width: 30px; height: 21px; fill: currentColor; display: block; }

        @media (max-width: 900px) { .news-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { .news-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <!-- 상단 네비게이션 바 -->
    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <img src="logo.png" alt="Glowmotion Logo" class="logo-img" onerror="this.style.display='none'">
                <span>GLOWMOTION</span>
            </a>
            <nav class="nav-menu">
                <a href="about.html" class="nav-item">ABOUT</a>
                <a href="talent.html" class="nav-item">TALENT</a>
                <a href="news.html" class="nav-item active">NEWS</a>
                <a href="notice.html" class="nav-item">NOTICE</a>
                <a href="contact.html" class="nav-item">CONTACT</a>
            </nav>
        </div>
    </header>

    <main class="news-hero">
        <div class="news-container">
            <h1 class="news-title">NEWS</h1>

            <div class="news-grid">
                <a href="#" class="news-card">
                    <div class="news-image-box">
                        <img src="news1.jpg" alt="뉴스 이미지 1" class="news-image" onerror="this.src='https://via.placeholder.com/600x337/1a1a24/ffffff?text=NEWS+1'">
                    </div>
                    <span class="news-date">준비중입니다.</span>
                    <h3 class="news-card-title">준비중입니다.</h3>
                </a>
                <a href="#" class="news-card">
                    <div class="news-image-box">
                        <img src="news2.jpg" alt="뉴스 이미지 2" class="news-image" onerror="this.src='https://via.placeholder.com/600x337/1a1a24/ffffff?text=NEWS+2'">
                    </div>
                    <span class="news-date">준비중입니다.</span>
                    <h3 class="news-card-title">준비중입니다.</h3>
                </a>
                <a href="#" class="news-card">
                    <div class="news-image-box">
                        <img src="news3.jpg" alt="뉴스 이미지 3" class="news-image" onerror="this.src='https://via.placeholder.com/600x337/1a1a24/ffffff?text=NEWS+3'">
                    </div>
                    <span class="news-date">준비중입니다.</span>
                    <h3 class="news-card-title">준비중입니다.</h3>
                </a>
            </div>

            <div class="more-news-bar">
                <a href="news-all.html" class="btn-more-news">전체보기 ➔</a>
            </div>

        </div>
    </main>

    <section class="info-section">
        <div class="info-container">
            <div class="brand-group">
                <img src="black logo.png" alt="Glowmotion Black Logo" class="bar-logo-img" onerror="this.style.display='none'">
                <span class="bar-company-name">GLOWMOTION</span>
            </div>
            <a href="https://www.youtube.com/@GlowmotionEntertainment" target="_blank" rel="noopener noreferrer" class="youtube-link" title="Glowmotion YouTube">
                <svg class="youtube-icon" viewBox="0 0 24 17" xmlns="http://www.w3.org/2000/svg">
                    <path d="M23.498 2.628a3.016 3.016 0 0 0-2.122-2.136C19.505 0 12 0 12 0s-7.505 0-9.377.492A3.017 3.017 0 0 0 .502 2.628C0 4.515 0 8.44 0 8.44s0 3.926.502 5.813a3.016 3.016 0 0 0 2.122 2.136c1.871.493 9.376.493 9.376.493s7.505 0 9.377-.493a3.015 3.015 0 0 0 2.122-2.136C24 12.366 24 8.44 24 8.44s0-3.925-.502-5.812zM9.545 12.022V4.858l6.273 3.582-6.273 3.582z"/>
                </svg>
            </a>
        </div>
    </section>

</body>
</html>
