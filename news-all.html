<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALL NEWS - Glowmotion</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #050505; color: #fff; overflow-x: hidden; }

        /* 상단 완전히 까만 고정 네비게이션 바 */
        .navbar {
            background-color: #000000;
            width: 100%;
            height: 70px;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-container {
            width: 100%;
            max-width: 1400px;
            height: 100%;
            margin: 0 auto;
            padding: 0 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: #ffffff;
            font-size: 20px;
            font-weight: 700;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: 1.5px;
        }

        .logo-img { height: 35px; width: auto; object-fit: contain; }

        .nav-menu { display: flex; gap: 30px; }
        .nav-item {
            color: #ccc;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 1px;
            transition: color 0.3s;
            position: relative;
            z-index: 10000;
            cursor: pointer;
        }
        .nav-item:hover, .nav-item.active { color: #fff; font-weight: 700; }

        /* 햄버거 토글 버튼 (PC에서는 숨김) */
        .menu-toggle {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            width: 28px;
            height: 20px;
            background: transparent;
            border: none;
            cursor: pointer;
            z-index: 10001;
        }
        .menu-toggle span {
            display: block;
            width: 100%;
            height: 2px;
            background-color: #ffffff;
            transition: all 0.3s ease;
        }

        .news-hero {
            margin-top: 70px;
            width: 100%;
            min-height: calc(100vh - 70px - 86px);
            padding: 80px 20px;
            background-color: #050505;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .news-container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }

        .news-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 40px;
            border-bottom: 2px solid #333333;
            padding-bottom: 20px;
        }

        .news-title {
            font-size: 40px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #ffffff;
        }

        .back-link {
            color: #888888;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }

        .back-link:hover { color: #ffffff; }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px 30px;
            width: 100%;
        }

        .news-card {
            text-decoration: none;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s;
        }

        .news-card:hover { transform: translateY(-5px); }
        .news-card:hover .news-card-title { color: #4da6ff; }

        /* 외부 서버 오류를 막기 위해 순수 CSS 박스로 변경된 이미지 박스 */
        .news-image-box {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #1a1a24;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666677;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .news-date { font-size: 13px; color: #777777; margin-bottom: 8px; }

        .news-card-title {
            font-size: 18px;
            font-weight: 700;
            line-height: 1.4;
            color: #ffffff;
            transition: color 0.2s;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .info-section {
            width: 100%;
            background-color: #ffffff;
            padding: 25px 0;
            margin-top: 60px;
        }

        .info-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 30px;
            display: flex;
            align-items: center;
        }

        .brand-group { display: flex; align-items: center; gap: 14px; }
        .bar-logo-img { height: 36px; width: auto; display: block; }
        .bar-company-name {
            font-size: 22px;
            font-weight: 800;
            color: #111111;
            letter-spacing: 1.5px;
            line-height: 1;
            display: inline-block;
        }

        .youtube-link {
            margin-left: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #111111;
            text-decoration: none;
            transition: opacity 0.2s, transform 0.2s;
        }

        .youtube-link:hover { opacity: 0.7; transform: scale(1.05); }
        .youtube-icon { width: 30px; height: 21px; fill: currentColor; display: block; }

        /* 모바일 반응형 네비게이션 및 그리드 조정 (1024px 이하) */
        @media (max-width: 1024px) {
            .nav-container {
                padding: 0 20px;
            }
            .logo {
                font-size: 15px;
                gap: 10px;
            }
            .logo-img {
                height: 28px;
            }
            .menu-toggle {
                display: flex;
            }
            .nav-menu {
                position: absolute;
                top: 70px;
                left: 0;
                width: 100%;
                background-color: #000000;
                flex-direction: column;
                align-items: center;
                gap: 0;
                max-height: 0;
                overflow: hidden;
                transition: max-height 0.3s ease-in-out;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            }
            .nav-menu.active {
                max-height: 350px;
            }
            .nav-item {
                width: 100%;
                text-align: center;
                padding: 15px 0;
                font-size: 15px;
                border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            }
            .news-grid { 
                grid-template-columns: repeat(2, 1fr); 
                gap: 30px 20px;
            }
            .news-title {
                font-size: 30px;
            }
        }

        @media (max-width: 600px) { 
            .news-grid { grid-template-columns: 1fr; } 
        }
    </style>
</head>
<body>

    <!-- 상단 네비게이션 바 -->
    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <img src="logo.png" alt="Glowmotion Logo" class="logo-img" onerror="this.style.display='none'">
                <span>GLOWMOTION</span>
            </a>
            <!-- 햄버거 토글 버튼 -->
            <button class="menu-toggle" id="menuToggle" aria-label="메뉴 열기">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <nav class="nav-menu" id="navMenu">
                <a href="about.html" class="nav-item">ABOUT</a>
                <a href="talent.html" class="nav-item">TALENT</a>
                <a href="news.html" class="nav-item active">NEWS</a>
                <a href="notice.html" class="nav-item">NOTICE</a>
                <a href="contact.html" class="nav-item">CONTACT</a>
            </nav>
        </div>
    </header>

    <main class="news-hero">
        <div class="news-container">
            <div class="news-header">
                <h1 class="news-title">ALL NEWS</h1>
                <a href="news.html" class="back-link">◂ NEWS 홈으로</a>
            </div>

            <div class="news-grid">
                <a href="#" class="news-card">
                    <div class="news-image-box">NEWS 1</div>
                    <span class="news-date">준비중입니다.</span>
                    <h3 class="news-card-title">준비중입니다.</h3>
                </a>
                <a href="#" class="news-card">
                    <div class="news-image-box">NEWS 2</div>
                    <span class="news-date">준비중입니다.</span>
                    <h3 class="news-card-title">준비중입니다.</h3>
                </a>
                <a href="#" class="news-card">
                    <div class="news-image-box">NEWS 3</div>
                    <span class="news-date">준비중입니다.</span>
                    <h3 class="news-card-title">준비중입니다.</h3>
                </a>
                <a href="#" class="news-card">
                    <div class="news-image-box">NEWS 4</div>
                    <span class="news-date">준비중입니다.</span>
                    <h3 class="news-card-title">준비중입니다.</h3>
                </a>
                <a href="#" class="news-card">
                    <div class="news-image-box">NEWS 5</div>
                    <span class="news-date">준비중입니다.</span>
                    <h3 class="news-card-title">준비중입니다.</h3>
                </a>
                <a href="#" class="news-card">
                    <div class="news-image-box">NEWS 6</div>
                    <span class="news-date">준비중입니다.</span>
                    <h3 class="news-card-title">준비중입니다.</h3>
                </a>
            </div>

        </div>
    </main>

    <section class="info-section">
        <div class="info-container">
            <div class="brand-group">
                <img src="black logo.png" alt="Glowmotion Black Logo" class="bar-logo-img" onerror="this.style.display='none'">
                <span class="bar-company-name">GLOWMOTION</span>
            </div>
            <a href="https://www.youtube.com/@GlowmotionEntertainment" target="_blank" rel="noopener noreferrer" class="youtube-link" title="Glowmotion YouTube">
                <svg class="youtube-icon" viewBox="0 0 24 17" xmlns="http://www.w3.org/2000/svg">
                    <path d="M23.498 2.628a3.016 3.016 0 0 0-2.122-2.136C19.505 0 12 0 12 0s-7.505 0-9.377.492A3.017 3.017 0 0 0 .502 2.628C0 4.515 0 8.44 0 8.44s0 3.926.502 5.813a3.016 3.016 0 0 0 2.122 2.136c1.871.493 9.376.493 9.376.493s7.505 0 9.377-.493a3.015 3.015 0 0 0 2.122-2.136C24 12.366 24 8.44 24 8.44s0-3.925-.502-5.812zM9.545 12.022V4.858l6.273 3.582-6.273 3.582z"/>
                </svg>
            </a>
        </div>
    </section>

    <!-- 햄버거 메뉴 작동용 자바스크립트 -->
    <script>
        const menuToggle = document.getElementById('menuToggle');
        const navMenu = document.getElementById('navMenu');

        menuToggle.addEventListener('click', () => {
            navMenu.classList.toggle('active');
        });

        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', () => {
                navMenu.classList.remove('active');
            });
        });
    </script>
</body>
</html>
